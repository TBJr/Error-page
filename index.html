<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#0b0d12">
        <meta name="description" content="Something went wrong on our end. Internal server error.">
        <title>TBJ — 500 Error</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/tbj.css">
    </head>
    <body>
        <div class="atmosphere" aria-hidden="true"></div>

        <main class="container">
            <section class="error">
                <p class="badge">Internal Server Error</p>
                <h1>500</h1>
                <h2>error</h2>
                <p class="lead">
                    Ruh-roh, something just isn’t right.
                    Time to paw through the logs and get down and dirty in the stack trace.
                </p>
                <div class="actions">
                    <a class="btn" href="/">Go home</a>
                    <button class="btn ghost" type="button" id="retry">Try again</button>
                </div>
            </section>

            <div class="stack-container" aria-hidden="true">
                <div class="card-container">
                    <div class="perspec" style="--spreaddist: 185px; --scaledist: .72; --vertdist: -34px; --rotdist: -10deg;">
                        <div class="card">
                            <div class="writing">
                                <div class="topbar">
                                    <div class="traffic">
                                        <span class="red"></span>
                                        <span class="yellow"></span>
                                        <span class="green"></span>
                                    </div>
                                    <span class="filename">panic.log</span>
                                </div>
                                <div class="code"><ul></ul></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card-container">
                    <div class="perspec" style="--spreaddist: 148px; --scaledist: .78; --vertdist: -27px; --rotdist: -8deg;">
                        <div class="card">
                            <div class="writing">
                                <div class="topbar">
                                    <div class="traffic">
                                        <span class="red"></span>
                                        <span class="yellow"></span>
                                        <span class="green"></span>
                                    </div>
                                    <span class="filename">exception.log</span>
                                </div>
                                <div class="code"><ul></ul></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card-container">
                    <div class="perspec" style="--spreaddist: 111px; --scaledist: .84; --vertdist: -20px; --rotdist: -6deg;">
                        <div class="card">
                            <div class="writing">
                                <div class="topbar">
                                    <div class="traffic">
                                        <span class="red"></span>
                                        <span class="yellow"></span>
                                        <span class="green"></span>
                                    </div>
                                    <span class="filename">request.log</span>
                                </div>
                                <div class="code"><ul></ul></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card-container">
                    <div class="perspec" style="--spreaddist: 74px; --scaledist: .9; --vertdist: -14px; --rotdist: -4deg;">
                        <div class="card">
                            <div class="writing">
                                <div class="topbar">
                                    <div class="traffic">
                                        <span class="red"></span>
                                        <span class="yellow"></span>
                                        <span class="green"></span>
                                    </div>
                                    <span class="filename">debug.log</span>
                                </div>
                                <div class="code"><ul></ul></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card-container">
                    <div class="perspec" style="--spreaddist: 37px; --scaledist: .95; --vertdist: -7px; --rotdist: -2deg;">
                        <div class="card">
                            <div class="writing">
                                <div class="topbar">
                                    <div class="traffic">
                                        <span class="red"></span>
                                        <span class="yellow"></span>
                                        <span class="green"></span>
                                    </div>
                                    <span class="filename">error.log</span>
                                </div>
                                <div class="code"><ul></ul></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card-container">
                    <div class="perspec" style="--spreaddist: 0px; --scaledist: 1; --vertdist: 0px; --rotdist: 0deg;">
                        <div class="card">
                            <div class="writing">
                                <div class="topbar">
                                    <div class="traffic">
                                        <span class="red"></span>
                                        <span class="yellow"></span>
                                        <span class="green"></span>
                                    </div>
                                    <span class="filename">stack-trace.log</span>
                                </div>
                                <div class="code"><ul></ul></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <script src="js/tbj.js"></script>
    </body>
</html>
